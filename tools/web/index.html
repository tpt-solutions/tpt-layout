<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tpt-layout playground</title>
  <style>
    :root { color-scheme: light dark; --gap: 16px; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: var(--gap); border-bottom: 1px solid #8884; }
    h1 { font-size: 1.1rem; margin: 0; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap);
           padding: var(--gap); height: calc(100vh - 64px); box-sizing: border-box; }
    textarea { width: 100%; height: 100%; box-sizing: border-box; font: 13px/1.4 ui-monospace, monospace;
               padding: 8px; resize: none; }
    #preview { overflow: auto; border: 1px solid #8884; padding: 8px; }
    #preview img { max-width: 100%; }
    #boxes { white-space: pre; font: 12px/1.4 ui-monospace, monospace; overflow: auto; }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; height: auto; }
      textarea { height: 40vh; }
    }
  </style>
</head>
<body>
  <header><h1>tpt-layout playground</h1></header>
  <main>
    <textarea id="input" spellcheck="false" aria-label="Document JSON"></textarea>
    <div id="preview" aria-live="polite"><img id="svg" alt="Layout preview"><pre id="boxes"></pre></div>
  </main>
  <script type="module">
    // Built with: wasm-pack or `wasm-bindgen --target web --out-dir pkg` (see README.md).
    import init, { render_svg, layout_json } from './pkg/tpt_layout_web.js';

    const sample = `{
  "width": 400,
  "root": {
    "display": "flex",
    "children": [
      { "width": 120, "padding": 8, "children": [{ "text": "Sidebar" }] },
      { "flex_grow": 1, "padding": 8, "children": [
          { "text": "Main column text that wraps across the available width." }
      ] }
    ]
  }
}`;

    const input = document.getElementById('input');
    const image = document.getElementById('svg');
    const boxes = document.getElementById('boxes');

    function update() {
      const json = input.value;
      const svg = render_svg(json);
      // A data URL keeps the generated markup isolated from the page.
      image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      try {
        boxes.textContent = JSON.stringify(JSON.parse(layout_json(json)), null, 2);
      } catch (error) {
        boxes.textContent = String(error);
      }
      try {
        localStorage.setItem('tpt-layout-playground', json);
      } catch (_) {
        // Storage can be unavailable (private windows); the playground works without it.
      }
    }

    await init();
    let saved = null;
    try { saved = localStorage.getItem('tpt-layout-playground'); } catch (_) {}
    input.value = saved ?? sample;
    input.addEventListener('input', update);
    update();
  </script>
</body>
</html>
