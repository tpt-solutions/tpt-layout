[package]
name = "tpt-layout-web"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings and a browser playground for tpt-layout"
publish = false

# Not part of the core crate's workspace: the core stays dependency-free.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-layout-spec = { path = "../spec" }
wasm-bindgen = "0.2"
