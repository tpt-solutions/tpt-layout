name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build without default features (no_std)
        run: cargo build --no-default-features
      - name: Build with std feature
        run: cargo build --features std
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Deterministic pagination hash and golden layouts
        run: cargo test --test paint_and_robustness

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build for wasm32 (no_std)
        run: cargo build --no-default-features --target wasm32-unknown-unknown

  unsafe-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No unsafe code
        run: |
          if grep -rn "unsafe" src/ --include=*.rs | grep -v "forbid(unsafe_code)"; then
            echo "unsafe code found"; exit 1
          fi
